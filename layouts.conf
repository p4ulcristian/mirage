# mirage virtual-screen layouts.
#
# Toggle at runtime with Alt+1 / Alt+2 / Alt+3 (the Nth [layout] below).
# Each section starts from the built-in defaults (config.c) and overrides only
# what it needs. Screens are keyed by VIRT number (1-based):
#   VIRT1, VIRT2 = 1920x1080 landscape   VIRT3, VIRT4 = 1080x2160 portrait
#
# Per-screen placement:
#   col=N            put the screen on column N of the grid (left->right)
#   yaw=DEG lift=M   instead, pin it to an exact pose (free placement)
#   arc=DEG          its angular width
# Global keys: distance, geometry (cylinder|flat), slab_depth, spacing, arc,
#              fov, sharpen, yaw_gain, pitch_gain, hdri (on|off).

active = wall

# 1) the default 3-column wall: portrait sides flank two stacked 16:9s.
[layout wall]
distance   = 2.0
geometry   = cylinder
slab_depth = 0.05
spacing    = 1.0
arc        = 40
screen 1 col=1 arc=40       # VIRT1 centre, top
screen 2 col=1 arc=40       # VIRT2 centre, bottom
screen 3 col=0 arc=23       # VIRT3 left portrait
screen 4 col=2 arc=23       # VIRT4 right portrait

# 2) a single flat row: all four side by side at eye level, no curve.
[layout row]
distance   = 2.2
geometry   = flat
slab_depth = 0.05
spacing    = 1.0
screen 3 col=0 arc=20       # left portrait
screen 1 col=1 arc=34       # landscape
screen 2 col=2 arc=34       # landscape
screen 4 col=3 arc=20       # right portrait

# 3) cinema: the two 16:9s stacked dead-centre, portraits pinned out wide.
[layout cinema]
distance   = 1.8
geometry   = cylinder
slab_depth = 0.05
spacing    = 1.0
screen 1 col=0 arc=48       # centre column, top
screen 2 col=0 arc=48       # centre column, bottom
screen 3 yaw=55  lift=0 arc=22   # left portrait, swung out
screen 4 yaw=-55 lift=0 arc=22   # right portrait, swung out
