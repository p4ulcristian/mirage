# mirage virtual-screen layouts (TOML) - the SINGLE source of truth.
#
# Each [[layout]] defines its screens by their 2D masonry CELL: w,h (resolution)
# and x,y (position in the desktop, in px). From that one set of numbers:
#   - scripts/setup_displays.py creates the Hyprland VIRT outputs (w,h at x,y), and
#   - mirage projects the 3D arc placement (yaw / arc-width / lift) onto the cylinder.
# So the desktop tiling and the on-glasses wall can't drift apart, and a layout can
# carry its own resolution (e.g. desk vs desk720). Switch at runtime with Alt+1/2/3
# (the Nth [[layout]]); the active one is also remembered across restarts.
#
# Per-screen keys (in a `screens` entry), VIRT number n is 1-based:
#   n, w, h, x, y      the masonry cell: resolution (w x h) + desktop position (x,y)
#   role               free-text note (ignored by the code)
#   col / yaw / lift / arc   OPTIONAL: override the projection (column grid or an
#                            exact pinned pose) for hand-placed / fanned layouts.
# Per-layout globals:
#   distance   eye -> wall distance (m)
#   geometry   "cylinder" | "flat"
#   wall_arc   total angular width the masonry spans (deg) - drives yaw + arc
#   eye_y      masonry y (px) that sits at eye level (lift 0)
#   gap        bezel inset fraction (0 = gapless; 0.08 ~= an 8% gap)
#   fov, sharpen, yaw_gain, pitch_gain, spacing, center_col, hdri ...
#   radius     corner rounding of each display, as a fraction of its height (0 = square, 0.05 ~ a gentle round)
#   msaa       MSAA samples on screen-edge geometry (0=off, 4=default); init-time only
#   mipmap     true/false - trilinear minification of the captured desktop (default true)
#
# NOTE: the old 7-panel "wall"/"row"/"cinema" layouts targeted a retired 7-output
# rig and were dropped in the unify. Ask to restore/convert them if you want them.

active = "desk720"

# 1) desk - a ring of NINE 16:9 Full-HD wings at eye level (VIRT1..9, centre wing
#    dead-ahead), plus VIRT10: a 21:9 ultrawide on a shelf ABOVE that is head-locked
#    (lazy yaw-follow) so it hovers above-front wherever you look. follow=true takes
#    VIRT10 off the wall; its lift/arc set the 3D hover height + width, and its x,y is
#    only the Hyprland 2D slot (a shelf above the row). 3-finger spin roams the wings.
[[layout]]
name     = "desk"
distance = 2.0
geometry = "cylinder"
wall_arc = 340          # 9-wide row -> a near-full ring
eye_y    = 540            # centre of the 1080-tall main row -> mains at eye level
gap      = 0.08
screens = [
  { n = 1, w = 1920, h = 1080, x = 0,     y = 1080, role = "wing 1 (far-left)" },
  { n = 2, w = 1920, h = 1080, x = 1920,  y = 1080, role = "wing 2" },
  { n = 3, w = 1920, h = 1080, x = 3840,  y = 1080, role = "wing 3" },
  { n = 4, w = 1920, h = 1080, x = 5760,  y = 1080, role = "wing 4" },
  { n = 5, w = 1920, h = 1080, x = 7680,  y = 1080, role = "wing 5 (centre, dead-ahead)" },
  { n = 6, w = 1920, h = 1080, x = 9600,  y = 1080, role = "wing 6" },
  { n = 7, w = 1920, h = 1080, x = 11520, y = 1080, role = "wing 7" },
  { n = 8, w = 1920, h = 1080, x = 13440, y = 1080, role = "wing 8" },
  { n = 9, w = 1920, h = 1080, x = 15360, y = 1080, role = "wing 9 (far-right)" },
  { n = 10, w = 2560, h = 1080, x = 7360, y = 0, follow = true, lift = 0.8, arc = 50, role = "21:9 ultrawide (follows view)" },
]

# 2) desk720 - identical arrangement to desk at 720p (wings 1280x720, ultrawide
#    1680x720). Wall geometry is the same (projection is scale-invariant); only the
#    capture resolution drops, so apps lay out larger, more legible UI through the glasses.
[[layout]]
name     = "desk720"
distance = 2.0
geometry = "cylinder"
wall_arc = 340
eye_y    = 360            # 540 * 2/3
gap      = 0.08
radius   = 0.025          # gently rounded display corners
screens = [
  { n = 1, w = 1280, h = 720, x = 0,     y = 720, role = "wing 1 (far-left)" },
  { n = 2, w = 1280, h = 720, x = 1280,  y = 720, role = "wing 2" },
  { n = 3, w = 1280, h = 720, x = 2560,  y = 720, role = "wing 3" },
  { n = 4, w = 1280, h = 720, x = 3840,  y = 720, role = "wing 4" },
  { n = 5, w = 1280, h = 720, x = 5120,  y = 720, role = "wing 5 (centre, dead-ahead)" },
  { n = 6, w = 1280, h = 720, x = 6400,  y = 720, role = "wing 6" },
  { n = 7, w = 1280, h = 720, x = 7680,  y = 720, role = "wing 7" },
  { n = 8, w = 1280, h = 720, x = 8960,  y = 720, role = "wing 8" },
  { n = 9, w = 1280, h = 720, x = 10240, y = 720, role = "wing 9 (far-right)" },
  { n = 10, w = 1680, h = 720, x = 4920, y = 0, follow = true, lift = 0.8, arc = 50, role = "21:9 ultrawide (follows view)" },
]
