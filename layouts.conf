# mirage virtual-screen layouts (TOML) - the SINGLE source of truth.
#
# Each [[layout]] defines its screens by their 2D masonry CELL: w,h (resolution)
# and x,y (position in the desktop, in px). From that one set of numbers:
#   - scripts/setup_displays.py creates the Hyprland VIRT outputs (w,h at x,y), and
#   - mirage projects the 3D arc placement (yaw / arc-width / lift) onto the cylinder.
# So the desktop tiling and the on-glasses wall can't drift apart, and a layout can
# carry its own resolution (e.g. desk vs desk720). Switch at runtime with Alt+1/2/3
# (the Nth [[layout]]); the active one is also remembered across restarts.
#
# Per-screen keys (in a `screens` entry), VIRT number n is 1-based:
#   n, w, h, x, y      the masonry cell: resolution (w x h) + desktop position (x,y)
#   role               free-text note (ignored by the code)
#   col / yaw / lift / arc   OPTIONAL: override the projection (column grid or an
#                            exact pinned pose) for hand-placed / fanned layouts.
# Per-layout globals:
#   distance   eye -> wall distance (m)
#   geometry   "cylinder" | "flat"
#   wall_arc   total angular width the masonry spans (deg) - drives yaw + arc
#   eye_y      masonry y (px) that sits at eye level (lift 0)
#   gap        bezel inset fraction (0 = gapless; 0.08 ~= an 8% gap)
#   fov, sharpen, yaw_gain, pitch_gain, spacing, center_col, hdri ...
#   msaa       MSAA samples on screen-edge geometry (0=off, 4=default); init-time only
#   mipmap     true/false - trilinear minification of the captured desktop (default true)
#
# NOTE: the old 7-panel "wall"/"row"/"cinema" layouts targeted a retired 7-output
# rig and were dropped in the unify. Ask to restore/convert them if you want them.

active = "desk720"

# 1) desk - ONE row of nine monitors: a 21:9 ultrawide dead-ahead in the centre,
#    eight 16:9 Full-HD wings around it. A near-full ring; 3-finger spin brings the
#    far screens to front. The centre cell's cx == half the row width, so the
#    ultrawide projects exactly to yaw 0. (Single row, VIRT1..9 contiguous.)
[[layout]]
name     = "desk"
distance = 2.0
geometry = "cylinder"
wall_arc = 340          # 9-wide row (17920 px) -> a near-full ring
eye_y    = 540            # centre of the single 1080-tall row -> mains at eye level
gap      = 0.08
screens = [
  { n = 1, w = 1920, h = 1080, x = 0,     y = 0, role = "wing 1 (far-left)" },
  { n = 2, w = 1920, h = 1080, x = 1920,  y = 0, role = "wing 2" },
  { n = 3, w = 1920, h = 1080, x = 3840,  y = 0, role = "wing 3" },
  { n = 4, w = 1920, h = 1080, x = 5760,  y = 0, role = "wing 4" },
  { n = 5, w = 2560, h = 1080, x = 7680,  y = 0, role = "21:9 ultrawide (centre, dead-ahead)" },
  { n = 6, w = 1920, h = 1080, x = 10240, y = 0, role = "wing 5" },
  { n = 7, w = 1920, h = 1080, x = 12160, y = 0, role = "wing 6" },
  { n = 8, w = 1920, h = 1080, x = 14080, y = 0, role = "wing 7" },
  { n = 9, w = 1920, h = 1080, x = 16000, y = 0, role = "wing 8 (far-right)" },
]

# 2) desk720 - identical arrangement to desk, at 720p (the wings are 1280x720, the
#    centre ultrawide 1706x720). The wall geometry is byte-for-byte the same
#    (projection is scale-invariant); only the capture resolution differs. Every
#    masonry number is desk's scaled by 2/3, so wall_arc/gap stay and eye_y scales.
[[layout]]
name     = "desk720"
distance = 2.0
geometry = "cylinder"
wall_arc = 340
eye_y    = 360            # 540 * 2/3
gap      = 0.08
screens = [
  { n = 1, w = 1280, h = 720, x = 0,     y = 0, role = "wing 1 (far-left)" },
  { n = 2, w = 1280, h = 720, x = 1280,  y = 0, role = "wing 2" },
  { n = 3, w = 1280, h = 720, x = 2560,  y = 0, role = "wing 3" },
  { n = 4, w = 1280, h = 720, x = 3840,  y = 0, role = "wing 4" },
  { n = 5, w = 1706, h = 720, x = 5120,  y = 0, role = "21:9 ultrawide (centre, dead-ahead)" },
  { n = 6, w = 1280, h = 720, x = 6826,  y = 0, role = "wing 5" },
  { n = 7, w = 1280, h = 720, x = 8106,  y = 0, role = "wing 6" },
  { n = 8, w = 1280, h = 720, x = 9386,  y = 0, role = "wing 7" },
  { n = 9, w = 1280, h = 720, x = 10666, y = 0, role = "wing 8 (far-right)" },
]
