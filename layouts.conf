# mirage virtual-screen layouts (TOML).
#
# Toggle at runtime with Alt+1 / Alt+2 / Alt+3 (the Nth [[layout]] below).
# Each layout starts from the built-in defaults (config.cpp) and overrides only
# what it needs. Screens are keyed by VIRT number n (1-based):
#   VIRT1..VIRT4 = 1920x1080 landscape   VIRT5..VIRT7 = 1080x2160 portrait
#
# Per-screen placement (in a `screens` entry):
#   col = N            put the screen on column N of the grid (left->right)
#   lift = M           on a column screen: nudge the whole column up/down (m)
#   yaw = DEG, lift = M   instead, pin it to an exact pose (free placement)
#   arc = DEG          its angular width
# Global keys: distance, geometry ("cylinder"|"flat"), slab_depth, spacing, arc,
#              center_col (column placed dead-ahead; -1 = centre whole span),
#              fov, sharpen, yaw_gain, pitch_gain, hdri (true|false).

active = "theater"

# 0) theater (matches scripts/setup_displays.py - keep them in sync, or regenerate
#    this block with `python3 scripts/setup_displays.py --layout`). A 21:9 banner
#    on top, two stacked 16:9 dead-ahead, a portrait on each side. The five panels
#    tile a clean rectangle in the 2D desktop so dragging between them is seamless.
#    Banner is free-placed (yaw=0) above the wall; tune lift/arc to taste.
[[layout]]
name       = "theater"
distance   = 2.0
geometry   = "cylinder"
slab_depth = 0.05
spacing    = 0.0
center_col = 1
screens = [
  { n = 1, yaw = 0.0, arc = 88, lift = 1.85 },  # 21:9 banner (free-placed, spans the wall)
  { n = 2, col = 0,   arc = 23, lift = 0.41 },  # left portrait
  { n = 3, col = 1,   arc = 40, lift = 0.41 },  # centre top 16:9
  { n = 4, col = 1,   arc = 40, lift = 0.41 },  # centre bottom 16:9
  { n = 5, col = 2,   arc = 23, lift = 0.41 },  # right portrait
]

# 1) the default wall (7-panel; needs the old 7-output setup): two stacked Full-HD
#    pairs on the left, then three single portraits.
[[layout]]
name       = "wall"
distance   = 2.0
geometry   = "cylinder"
slab_depth = 0.05
spacing    = 1.0
arc        = 40
center_col = 1                   # col 1 (VIRT3/VIRT4) dead ahead at yaw 0
screens = [
  { n = 1, col = 0, arc = 40, lift = 0.41 },  # VIRT1 col0, top
  { n = 2, col = 0, arc = 40, lift = 0.41 },  # VIRT2 col0, bottom -> eye level
  { n = 3, col = 1, arc = 40, lift = 0.41 },  # VIRT3 col1, top
  { n = 4, col = 1, arc = 40, lift = 0.41 },  # VIRT4 col1, bottom -> eye level
  { n = 5, col = 2, arc = 23, lift = 0.41 },  # VIRT5 col2 portrait, bottom aligned
  { n = 6, col = 3, arc = 23, lift = 0.41 },  # VIRT6 col3 portrait, bottom aligned
  { n = 7, col = 4, arc = 23, lift = 0.41 },  # VIRT7 col4 portrait, bottom aligned
]

# 2) a single flat row: all seven side by side, no curve.
[[layout]]
name       = "row"
distance   = 2.4
geometry   = "flat"
slab_depth = 0.05
spacing    = 1.0
center_col = -1                  # centre the whole row span
screens = [
  { n = 1, col = 0, arc = 28 },  # landscape
  { n = 2, col = 1, arc = 28 },  # landscape
  { n = 3, col = 2, arc = 28 },  # landscape
  { n = 4, col = 3, arc = 28 },  # landscape
  { n = 5, col = 4, arc = 16 },  # portrait
  { n = 6, col = 5, arc = 16 },  # portrait
  { n = 7, col = 6, arc = 16 },  # portrait
]

# 3) cinema: the main landscape pair stacked dead-centre, the rest fanned wide.
[[layout]]
name       = "cinema"
distance   = 1.9
geometry   = "cylinder"
slab_depth = 0.05
spacing    = 1.0
screens = [
  { n = 1, col = 0, arc = 46 },              # centre stack, top
  { n = 2, col = 0, arc = 46 },              # centre stack, bottom
  { n = 3, yaw = 46,  lift = 0, arc = 38 },  # near left  (landscape)
  { n = 4, yaw = -46, lift = 0, arc = 38 },  # near right (landscape)
  { n = 5, yaw = 82,  lift = 0, arc = 24 },  # left portrait
  { n = 6, yaw = -82, lift = 0, arc = 24 },  # right portrait
  { n = 7, yaw = 108, lift = 0, arc = 24 },  # far left portrait
]
