# mirage virtual-screen layouts.
#
# Toggle at runtime with Alt+1 / Alt+2 / Alt+3 (the Nth [layout] below).
# Each section starts from the built-in defaults (config.c) and overrides only
# what it needs. Screens are keyed by VIRT number (1-based):
#   VIRT1..VIRT4 = 1920x1080 landscape   VIRT5..VIRT7 = 1080x2160 portrait
#
# Per-screen placement:
#   col=N            put the screen on column N of the grid (left->right)
#   lift=M           on a column screen: nudge the whole column up/down (m)
#   yaw=DEG lift=M   instead, pin it to an exact pose (free placement)
#   arc=DEG          its angular width
# Global keys: distance, geometry (cylinder|flat), slab_depth, spacing, arc,
#              center_col (column placed dead-ahead; -1 = centre whole span),
#              fov, sharpen, yaw_gain, pitch_gain, hdri (on|off).

active = wall

# 1) the default wall: two stacked Full-HD pairs on the left, then three single
#    portraits. col 0 pair is centred; col 1 is lifted so its bottom panel sits
#    at eye level; each portrait is centred. (lift 0.41 = half a 40deg panel.)
[layout wall]
distance   = 2.0
geometry   = cylinder
slab_depth = 0.05
spacing    = 1.0
arc        = 40
center_col = 1                   # col 1 (VIRT3/VIRT4) dead ahead at yaw 0
screen 1 col=0 arc=40 lift=0.41  # VIRT1 col0, top
screen 2 col=0 arc=40 lift=0.41  # VIRT2 col0, bottom -> eye level
screen 3 col=1 arc=40 lift=0.41  # VIRT3 col1, top
screen 4 col=1 arc=40 lift=0.41  # VIRT4 col1, bottom -> eye level
screen 5 col=2 arc=23 lift=0.41  # VIRT5 col2 portrait, bottom aligned
screen 6 col=3 arc=23 lift=0.41  # VIRT6 col3 portrait, bottom aligned
screen 7 col=4 arc=23 lift=0.41  # VIRT7 col4 portrait, bottom aligned

# 2) a single flat row: all seven side by side at eye level, no curve.
[layout row]
distance   = 2.4
geometry   = flat
slab_depth = 0.05
spacing    = 1.0
center_col = -1                  # centre the whole row span
screen 1 col=0 arc=28            # landscape
screen 2 col=1 arc=28            # landscape
screen 3 col=2 arc=28            # landscape
screen 4 col=3 arc=28            # landscape
screen 5 col=4 arc=16            # portrait
screen 6 col=5 arc=16            # portrait
screen 7 col=6 arc=16            # portrait

# 3) cinema: the main landscape pair stacked dead-centre, the rest fanned wide.
[layout cinema]
distance   = 1.9
geometry   = cylinder
slab_depth = 0.05
spacing    = 1.0
screen 1 col=0 arc=46            # centre stack, top
screen 2 col=0 arc=46            # centre stack, bottom
screen 3 yaw=46  lift=0 arc=38   # near left  (landscape)
screen 4 yaw=-46 lift=0 arc=38   # near right (landscape)
screen 5 yaw=82  lift=0 arc=24   # left portrait
screen 6 yaw=-82 lift=0 arc=24   # right portrait
screen 7 yaw=108 lift=0 arc=24   # far left portrait
